# /etc/NetworkManager/conf.d/00-appliance.conf
# ---------------------------------------------------------------------------
# TaishanPi One-KVM appliance NetworkManager defaults.
# ---------------------------------------------------------------------------

[main]
# Do not auto-create volatile connections for every wired/wireless device.
# The appliance is provisioned explicitly (station profile or recovery AP).
no-auto-default=*

[connectivity]
# The appliance may live on an isolated LAN with no internet reachability.
# Disable NM's connectivity probing so it never marks the link as limited.
enabled=false

[device]
# Disable Wi-Fi power saving (2 = disable) for stable, low-latency KVM
# streaming and to avoid AP6212 firmware power-save stalls.
wifi.powersave=2
