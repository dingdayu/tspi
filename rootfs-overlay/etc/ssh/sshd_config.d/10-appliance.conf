# /etc/ssh/sshd_config.d/10-appliance.conf
# ---------------------------------------------------------------------------
# TaishanPi One-KVM appliance SSH policy (AGENTS.md sections 2.6 and 14).
#
# Applied through the `Include /etc/ssh/sshd_config.d/*.conf` directive that
# Debian/Ubuntu ship at the top of /etc/ssh/sshd_config (OpenSSH >= 8.2).
# ---------------------------------------------------------------------------

# Root login over SSH is never permitted; use the maintenance account.
PermitRootLogin no

# Public-key authentication is the production default.
PubkeyAuthentication yes

# Password authentication is DISABLED by default.
# Development override: set ALLOW_PASSWORD_SSH=1 in config/local.env (or the
# build environment) and scripts/rootfs/customize.sh flips this to "yes".
# Never enable this on a production image.
PasswordAuthentication no

# Do not expose keyboard-interactive as a password-auth side channel.
KbdInteractiveAuthentication no
