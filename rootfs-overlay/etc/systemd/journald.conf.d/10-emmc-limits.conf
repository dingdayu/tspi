# /etc/systemd/journald.conf.d/10-emmc-limits.conf
# ---------------------------------------------------------------------------
# Bound journal growth for the ~16 GB eMMC target (AGENTS.md section 13).
# ---------------------------------------------------------------------------

[Journal]
Storage=persistent
SystemMaxUse=64M
SystemKeepFree=256M
RuntimeMaxUse=16M
MaxRetentionSec=2week
